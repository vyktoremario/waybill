name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waybill/shared build
      - name: Typecheck api, web and driver app
        run: |
          pnpm --filter @waybill/api typecheck
          pnpm --filter @waybill/web typecheck
          pnpm --filter @waybill/driver typecheck
      - name: Build web
        run: pnpm --filter @waybill/web build
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t waybill-api .

  test:
    runs-on: ubuntu-latest
    # Same ports as docker-compose.yml, so the tests' defaults work unchanged.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: waybill
          POSTGRES_PASSWORD: waybill
          POSTGRES_DB: waybill
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U waybill" --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-management
        ports: ['55672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waybill/shared build
      - name: Shared (state machine, pricing)
        run: pnpm --filter @waybill/shared test
      - name: API integration tests (Postgres + RabbitMQ)
        run: pnpm --filter @waybill/api test
